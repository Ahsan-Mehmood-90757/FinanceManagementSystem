# Local PostgreSQL for development:  docker compose up -d
# Connect DBeaver to localhost:5432, user postgres / postgres, database fms_dev.
services:
  postgres:
    image: postgres:17-alpine
    container_name: fms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fms_dev
    ports:
      - "5432:5432"
    volumes:
      - fms_pgdata:/var/lib/postgresql/data

volumes:
  fms_pgdata:
